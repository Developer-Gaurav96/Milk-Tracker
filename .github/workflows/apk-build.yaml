name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew build

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Rename APKs to 'Milk Tracker'
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk "Milk Tracker (debug).apk"
        mv app/build/outputs/apk/release/app-release.apk "Milk Tracker (release).apk"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (debug)
        path: "Milk Tracker (debug).apk"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (release)
        path: "Milk Tracker (release).apk"

    - name: Run tests
      run: ./gradlew test

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
