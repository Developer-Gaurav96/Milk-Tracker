name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Install Gradle
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq gradle
    - name: Build with Gradle
      run: gradle build
    - name: Build Debug APK
      run: gradle assembleDebug
    - name: Build Release APK
      run: gradle assembleRelease
    - name: Rename APKs to 'Milk Tracker'
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk "Milk Tracker (debug).apk" || true
        mv app/build/outputs/apk/release/app-release.apk "Milk Tracker (release).apk" || true
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (debug)
        path: "Milk Tracker (debug).apk"
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (release)
        path: "Milk Tracker (release).apk"
    - name: Run tests
      run: gradle test
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
