name: Build APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Install Gradle 8.2.2
      run: |
        curl -L -o gradle-8.2.2-bin.zip https://services.gradle.org/distributions/gradle-8.2.2-bin.zip
        unzip -q gradle-8.2.2-bin.zip
        echo "GRADLE_HOME=$PWD/gradle-8.2.2" >> $GITHUB_ENV
        echo "$PWD/gradle-8.2.2/bin" >> $GITHUB_PATH

    - name: Build with Gradle
      run: gradle build --no-daemon

    - name: Build Debug APK
      run: gradle assembleDebug --no-daemon

    - name: Build Release APK
      run: gradle assembleRelease --no-daemon

    - name: Rename APKs to 'Milk Tracker'
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk "Milk Tracker (debug).apk"
        mv app/build/outputs/apk/release/app-release.apk "Milk Tracker (release).apk"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (debug)
        path: "Milk Tracker (debug).apk"

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: Milk Tracker (release)
        path: "Milk Tracker (release).apk"

    - name: Run tests
      run: gradle test --no-daemon

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/
